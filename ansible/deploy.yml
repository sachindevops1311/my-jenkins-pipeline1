# ✅ Fixed - no sudo needed
- hosts: localhost
  become: no           # ← change this
  tasks:
    - name: Pull Docker image
      command: docker pull {{ docker_image }}

    - name: Stop existing container
      command: docker stop jenkins-app
      ignore_errors: yes

    - name: Remove existing container
      command: docker rm jenkins-app
      ignore_errors: yes

    - name: Run new container
      command: >
        docker run -d
        --name jenkins-app
        -p 5000:5000
        {{ docker_image }}
